<!doctype html>
<html lang="en">
    <head>
        <title>about me :3</title>
        <meta property="og:url" content="https://sleepyfaith.github.io" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="faith's about me :3" />
        <meta property="og:description" content="if u see this ur a cutie :3" />
        <meta name="theme-color" content="#aa7bff" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- global css -->
        <link rel="stylesheet" href="css/common.css" />

        <!-- platform based css -->
        <link rel="stylesheet" href="css/desktop.css" media="screen and (min-width: 768px)" />
        <link rel="stylesheet" href="css/mobile.css" media="screen and (max-width: 767px)" />

        <script src="https://kit.fontawesome.com/144e8a950b.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <div class="panel">
            <div class="right widget-container">
                <div class="widget" id="clock"></div>
                <div class="widget" id="active-windows">
                    <div class="app-icon hidden" id="active-windows-about"><i class="fa-regular fa-id-card"></i></div>
                    <div class="app-icon hidden" id="active-windows-likes"><i class="fa-regular fa-heart"></i></div>
                    <div class="app-icon hidden" id="active-windows-specs"><i class="fa-solid fa-computer"></i></div>
                    <div class="app-icon hidden" id="active-windows-projects"><i class="fa-solid fa-folder"></i></div>
                    <div class="app-icon hidden" id="active-windows-socials"><i class="fa-solid fa-folder"></i></div>
                    <div class="app-icon hidden" id="active-windows-mods"><i class="fa-solid fa-folder"></i></div>
                    <div class="app-icon hidden" id="active-windows-friends"><i class="fa-solid fa-folder"></i></div>
                    <div class="app-icon hidden" id="active-windows-speedruns"><i class="fa-solid fa-medal"></i></div>
                    <div class="app-icon hidden" id="active-windows-settings"><i class="fa-solid fa-gear"></i></div>
                    <div class="app-icon hidden" id="active-windows-connect4">
                        <i class="fa-solid fa-circle" id="red" style="color: rgb(255, 93, 93)"></i
                        ><i class="fa-solid fa-circle" id="yellow" style="color: rgb(255, 255, 158)"></i>
                    </div>
                    <div class="app-icon hidden" id="active-windows-maze"><i class="fa-solid fa-signs-post"></i></div>
                    <div class="app-icon hidden" id="active-windows-tomoko"><i class="fa-solid fa-brain"></i></div>
                </div>
            </div>
            <div class="left widget-container">
                <div class="widget" id="heartrate">
                    <iframe
                        src="https://pulsoid.net/widget/view/1c041bdd-ef2f-4527-8761-571c8a67afc8"
                        style="color: white"
                    ></iframe>
                </div>
                <div class="widget" id="settings"><i class="fa-solid fa-gear"></i></div>
            </div>
        </div>
        <div class="desktop">
            <button class="app-icon" id="about">
                <i class="fa-regular fa-id-card"></i><span class="app-label" data-i18n="apps.about"></span>
            </button>
            <button class="app-icon" id="likes">
                <i class="fa-regular fa-heart"></i><span class="app-label" data-i18n="apps.likes"></span>
            </button>
            <button class="app-icon" id="specs">
                <i class="fa-solid fa-computer"></i><span class="app-label" data-i18n="apps.specs"></span>
            </button>
            <button class="app-icon" id="speedruns">
                <i class="fa-solid fa-medal"></i><span class="app-label" data-i18n="apps.speedruns"></span>
            </button>
            <button class="app-icon folder" id="projects">
                <i class="fa-solid fa-folder"></i><span class="app-label" data-i18n="apps.projects"></span>
            </button>
            <button class="app-icon folder" id="socials">
                <i class="fa-solid fa-folder"></i><span class="app-label" data-i18n="apps.socials"></span>
            </button>
            <button class="app-icon folder" id="mods">
                <i class="fa-solid fa-folder"></i><span class="app-label" data-i18n="apps.mods"></span>
            </button>
            <button class="app-icon folder" id="friends">
                <i class="fa-solid fa-folder"></i><span class="app-label" data-i18n="apps.friends"></span>
            </button>
        </div>

        <div class="windows"></div>
    </body>

    <script type="module" src="js/main.js"></script>
</html>
